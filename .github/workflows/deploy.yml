
name: Deploy Lovable via FTP na HostGator

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Build do projeto
        run: npm run build

      - name: Localizar arquivos do build
        shell: bash
        run: |
          echo "Conteúdo da raiz do projeto:"
          ls -la

          if [ -f dist/index.html ]; then
            echo "DEPLOY_DIR=dist" >> "$GITHUB_ENV"
          elif [ -f build/index.html ]; then
            echo "DEPLOY_DIR=build" >> "$GITHUB_ENV"
          elif [ -f out/index.html ]; then
            echo "DEPLOY_DIR=out" >> "$GITHUB_ENV"
          else
            echo "Não encontrei index.html nas pastas conhecidas."
            echo "Procurando arquivos index.html:"
            find . -maxdepth 5 -type f -name index.html \
              -not -path './node_modules/*' \
              -not -path './.git/*'
            exit 1
          fi

          echo "Pasta de publicação identificada."

      - name: Adicionar .htaccess ao build
        shell: bash
        run: |
          cat > "$DEPLOY_DIR/.htaccess" <<'EOF'
          DirectoryIndex index.html index.php
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF

          echo "Arquivos que serão publicados:"
          ls -la "$DEPLOY_DIR"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /public_html/
          local-dir: ${{ env.DEPLOY_DIR }}/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: verbose
