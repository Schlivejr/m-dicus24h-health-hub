
name: Deploy Lovable via FTP na HostGator

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Build do projeto
        run: npm run build

      - name: Verificar saída pública
        shell: bash
        run: |
          echo "Conteúdo de .output:"
          find .output -maxdepth 3 -type f | head -80

          if [ -f .output/public/index.html ]; then
            echo "DEPLOY_DIR=.output/public" >> "$GITHUB_ENV"
            echo "Saída estática encontrada."
          else
            echo "ERRO: .output/public/index.html não existe."
            echo "O projeto pode exigir um servidor Nitro."
            exit 1
          fi

      - name: Adicionar .htaccess
        run: |
          cat > .output/public/.htaccess <<'EOF'
          DirectoryIndex index.html index.php
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF

      - name: Mostrar arquivos que serão publicados
        run: ls -la .output/public/

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /public_html/
          local-dir: .output/public/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: verbose
